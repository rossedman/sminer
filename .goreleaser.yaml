# Release builds. A pushed tag (v*) runs .github/workflows/release.yml,
# which runs this. Try it locally with: make release-snapshot
version: 2

project_name: sminer

before:
  hooks:
    - go mod download
    - ./scripts/extras.sh

builds:
  - main: ./cmd/sminer
    env:
      - CGO_ENABLED=0 # the SQLite driver is pure Go
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/rossedman/sminer/internal/version.Version={{ .Tag }}
      - -X github.com/rossedman/sminer/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/rossedman/sminer/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt

# Keyless Sigstore signature over checksums.txt, which covers every archive.
# The release workflow's GitHub OIDC identity signs it; there are no keys.
# Verify with the commands in SECURITY.md.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - '^(docs|test|ci|chore|style)(\(.+\))?:'
  # Conventional Commits (CONTRIBUTING.md).
  groups:
    - title: Breaking changes
      regexp: '^\w+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: Other changes
      order: 999

release:
  github:
    owner: rossedman
    name: sminer
  footer: |
    Install with Homebrew (`brew install rossedman/tap/sminer`), `go install github.com/rossedman/sminer/cmd/sminer@{{ .Tag }}`,
    or download an archive below and put `sminer` on your PATH. Docs: https://rossedman.io/sminer/

# A Homebrew cask in rossedman/homebrew-tap. It's skipped until the
# HOMEBREW_TAP_GITHUB_TOKEN secret exists (see docs/releasing.md).
homebrew_casks:
  - name: sminer
    repository:
      owner: rossedman
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if not (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") }}true{{ end }}'
    directory: Casks
    homepage: https://rossedman.io/sminer/
    description: Find the corrections you keep making to Claude, and fix them for good
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "sminer {{ .Tag }}"
    completions:
      bash: completions/sminer.bash
      zsh: completions/sminer.zsh
      fish: completions/sminer.fish
    manpages:
      - manpages/sminer.1.gz
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/sminer"]
          end
