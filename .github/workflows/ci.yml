name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt
      - name: vet
        run: make vet
      - name: test
        run: go test -race ./...
      - name: eval (heuristics, labelled set)
        run: make eval
      - name: fuzz (short)
        run: go test ./internal/transcript -run '^$' -fuzz FuzzDecode -fuzztime 15s

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
