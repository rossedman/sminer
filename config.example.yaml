# Copy to $XDG_CONFIG_HOME/sminer/config.yaml (default ~/.config/sminer/config.yaml),
# ~/.sminer.yaml or ./.sminer.yaml; sminer reads the first of these it finds.
# Every key is optional and can also be set by flag or environment variable:
# classifier.model is SMINER_CLASSIFIER_MODEL. Run `sminer config show` to see
# the effective values and where each one came from.

# Where Claude Code keeps per-session JSONL transcripts.
roots: [~/.claude/projects]

# How far back to ingest and analyze (--since).
window: 90d

# Occurrences a finding needs to be reported (--min-count).
min_count: 3

# Never call the network: no classifier, no proposal drafting (--offline).
offline: false

# Repos never ingested (globs; a pattern also matches subdirectories).
exclude_repos: ["~/personal/*"]

classifier:
  model: claude-haiku-5-5
  # Caps classifier and proposal-drafting calls per run.
  max_calls_per_run: 500
  concurrency: 4

embeddings:
  # auto: a local ollama server if it answers, else the built-in hashed model.
  provider: auto
  model: nomic-embed-text
  url: http://localhost:11434

cluster:
  # Cosine similarity needed to join a cluster. 0 uses the embedder default
  # (0.45 hashed, 0.78 ollama).
  threshold: 0

redact:
  # Added to the built-in secret patterns. A pattern also redacts a
  # following "= value" or ": value".
  patterns: ["(?i)aws_secret", "ghp_[A-Za-z0-9]+"]

remedies:
  hooks_dir: ~/src/claude-hooks
  global_claude_md: ~/.claude/CLAUDE.md
  skills_dir: ~/.claude/skills
  settings: ~/.claude/settings.json

# Defaults live under $XDG_DATA_HOME/sminer (~/.local/share/sminer).
# db: ~/.local/share/sminer/sminer.db
# patch_dir: ~/.local/share/sminer/patches

# Output. The matching flags (--json, --quiet, --verbose, --no-color) win
# over these.
# json: false
# quiet: false
# verbose: false
# no_color: false
