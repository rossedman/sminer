<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- sminer: a cut gem (the finding you mine out of transcripts) with a
       terminal prompt in its face. -->
  <defs>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8b0"/>
      <stop offset="1" stop-color="#f6bb4c"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b543"/>
      <stop offset="1" stop-color="#d98f22"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eba536"/>
      <stop offset="1" stop-color="#b8741a"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a24"/>
      <stop offset="1" stop-color="#8f5512"/>
    </linearGradient>
  </defs>
  <!-- crown -->
  <path d="M54 52 L146 52 L178 90 L22 90 Z" fill="url(#crown)"/>
  <path d="M74 52 L126 52 L114 90 L86 90 Z" fill="url(#table)"/>
  <path d="M54 52 L74 52 L86 90 L22 90 Z" fill="#ffd98c" opacity="0.55"/>
  <!-- pavilion -->
  <path d="M22 90 L86 90 L100 180 Z" fill="url(#left)"/>
  <path d="M86 90 L114 90 L100 180 Z" fill="url(#mid)"/>
  <path d="M114 90 L178 90 L100 180 Z" fill="url(#right)"/>
  <!-- girdle highlight -->
  <path d="M22 90 L178 90" stroke="#fff1cc" stroke-width="2.5" opacity="0.7"/>
  <!-- prompt, in the night ink of the brand -->
  <path d="M70 104 L92 118 L70 132" fill="none" stroke="#0e1020" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="100" y="124" width="32" height="10" rx="5" fill="#0e1020"/>
  <!-- glint -->
  <path d="M160 20 L164 34 L178 38 L164 42 L160 56 L156 42 L142 38 L156 34 Z" fill="#7fe3d3"/>
</svg>
